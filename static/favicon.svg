<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Termina">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <!-- rounded window -->
  <rect x="4" y="6" width="56" height="52" rx="10" fill="url(#bg)" stroke="#22c55e" stroke-width="2"/>
  <!-- title bar -->
  <rect x="4" y="6" width="56" height="12" rx="10" fill="#052e16"/>
  <rect x="4" y="12" width="56" height="6" fill="#052e16"/>
  <!-- traffic lights -->
  <circle cx="14" cy="12" r="2.2" fill="#ef4444"/>
  <circle cx="22" cy="12" r="2.2" fill="#eab308"/>
  <circle cx="30" cy="12" r="2.2" fill="#22c55e"/>
  <!-- prompt >_ -->
  <path d="M16 30 L26 36 L16 42" fill="none" stroke="#4ade80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="42" x2="48" y2="42" stroke="#86efac" stroke-width="3.2" stroke-linecap="round"/>
  <!-- cursor blink bar -->
  <rect x="50" y="36" width="2.5" height="10" rx="1" fill="#bbf7d0"/>
</svg>
